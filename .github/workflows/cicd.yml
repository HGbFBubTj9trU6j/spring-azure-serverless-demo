name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      ENTRA_TENANT_ID: test-tenant-id

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        run: ./mvnw clean test

      - name: Load build configuration
        shell: pwsh
        working-directory: .
        run: |
          $config = Import-PowerShellDataFile "./config/dev.psd1"
          "BACKEND_BUILDER_IMAGE=$($config.BackendBuilderImage)" >> $env:GITHUB_ENV

      - name: Build backend OCI image
        run: |
          ./mvnw spring-boot:build-image \
            -Dspring-boot.build-image.imageName=spring-azure-serverless-demo/backend:${{ github.sha }} \
            -Dbuild.version=${{ github.sha }} \
            -Dspring-boot.build-image.builder=${{ env.BACKEND_BUILDER_IMAGE }} \
            -Dspring-boot.build-image.imagePlatform=linux/amd64

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Load deployment configuration
        shell: pwsh
        working-directory: .
        run: |
          $config = Import-PowerShellDataFile "./config/dev.psd1"
          "ACR_NAME=$($config.AcrName)" >> $env:GITHUB_ENV
          "ACR_LOGIN_SERVER=$($config.AcrName).azurecr.io" >> $env:GITHUB_ENV

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Tag backend OCI image
        run: |
          docker tag \
            spring-azure-serverless-demo/backend:${{ github.sha }} \
            ${{ env.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}

      - name: Push backend OCI image
        run: |
          docker push \
            ${{ env.ACR_LOGIN_SERVER }}/backend:${{ github.sha }}

      - name: Deploy backend to Azure Container Apps
        shell: pwsh
        working-directory: .
        run: |
          ./scripts/deploy-backend-image.ps1 `
            -ImageTag "${{ github.sha }}"

      - name: Verify backend deployment
        shell: pwsh
        working-directory: .
        run: |
          ./scripts/verify-backend-deployment.ps1 `
            -ImageTag "${{ github.sha }}"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build frontend for production
        shell: pwsh
        working-directory: .
        env:
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          VITE_ENTRA_TENANT_ID: ${{ secrets.VITE_ENTRA_TENANT_ID }}
          VITE_ENTRA_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID }}
          VITE_API_SCOPE: ${{ secrets.VITE_API_SCOPE }}
        run: |
          ./scripts/build-frontend.ps1 `
            -BuildVersion "${{ github.sha }}"

      - name: Deploy frontend to Azure Static Web Apps
        shell: pwsh
        working-directory: .
        env:
          SWA_DEPLOYMENT_TOKEN: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
        run: |
          ./scripts/deploy-frontend.ps1

      - name: Verify frontend deployment
        shell: pwsh
        working-directory: .
        run: |
          $config = Import-PowerShellDataFile "./config/dev.psd1"

          $frontendHostName = az staticwebapp show `
            --name $config.StaticWebAppName `
            --resource-group $config.ResourceGroup `
            --query "defaultHostname" `
            --output tsv

          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($frontendHostName)) {
              throw "Failed to get Static Web App hostname."
          }

          $frontendBaseUrl = "https://$frontendHostName"

          ./scripts/verify-frontend-deployment.ps1 `
            -ExpectedVersion "${{ github.sha }}" `
            -FrontendBaseUrl $frontendBaseUrl
