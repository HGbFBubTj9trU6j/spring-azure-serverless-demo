name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      ENTRA_TENANT_ID: test-tenant-id

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        run: ./mvnw clean test

      - name: Build backend OCI image
        run: |
          ./mvnw spring-boot:build-image \
            -Dspring-boot.build-image.imageName=spring-azure-serverless-demo/backend:${{ github.sha }} \
            -Dbuild.version=${{ github.sha }} \
            -Dspring-boot.build-image.builder=paketobuildpacks/builder-noble-java-tiny:0.0.197 \
            -Dspring-boot.build-image.imagePlatform=linux/amd64

      - name: Azure login with OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name springazureserverlessdemodevacr

      - name: Tag backend OCI image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            spring-azure-serverless-demo/backend:${{ github.sha }} \
            springazureserverlessdemodevacr.azurecr.io/backend:${{ github.sha }}

      - name: Push backend OCI image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push \
            springazureserverlessdemodevacr.azurecr.io/backend:${{ github.sha }}

      - name: Deploy backend to Azure Container Apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        working-directory: .
        run: |
          ./scripts/deploy-backend-image.ps1 `
            -ImageTag "${{ github.sha }}"

      - name: Verify backend deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        working-directory: .
        run: |
          ./scripts/verify-backend-deployment.ps1 `
            -ImageTag "${{ github.sha }}"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Azure login with OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build frontend for production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        working-directory: .
        env:
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
        run: |
          ./scripts/build-frontend.ps1 `
            -BuildVersion "${{ github.sha }}"

      - name: Deploy frontend to Azure Static Web Apps
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        working-directory: .
        env:
          SWA_DEPLOYMENT_TOKEN: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
        run: |
          ./scripts/deploy-frontend.ps1
